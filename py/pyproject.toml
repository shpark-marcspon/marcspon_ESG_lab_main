[project]
name = "esg-lab-py"
version = "0.0.0"
description = "esg-lab Python 조각 (docparse, factors)"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.26",
    "jsonschema>=4.23",
    "openpyxl>=3.1.5",
    "pypdfium2>=5.14.0",
]

[dependency-groups]
dev = ["pytest>=8"]
greenwash = [
    "pypdf==6.20.1",
    "langchain-text-splitters==1.1.3",
    "numpy==2.5.4",
    "tiktoken==0.14.0",
]
scope3colab = [
    "pandas==2.3.3",
    "rapidfuzz==3.14.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
